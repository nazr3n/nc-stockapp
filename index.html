<title>NC Stock Manager</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: one narrow column like a clipboard checklist; big tap targets; status shown as chips */
:root{
  --teal:#1B97A0; --teal-ink:#0F6E75; --mist:#E8ECEF; --char:#46464A;
  --bg:#F4F7F8; --card:#FFFFFF; --fg:#2B2C30; --muted:#6A6D74; --line:#D5DCE0;
  --ok:#1E7F4F; --ok-bg:#E2F3EA; --warn:#9A5B00; --warn-bg:#FCEFD9; --bad:#B3261E; --bad-bg:#FBE4E2;
  --tealbg:#DDF1F2; --on-teal:#FFFFFF;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --teal:#3DB6BF; --teal-ink:#7FD3D9; --mist:#2A2F33; --char:#C9CCD1;
  --bg:#151719; --card:#1E2124; --fg:#ECEEF0; --muted:#A3A8AE; --line:#343A3F;
  --ok:#6FD39E; --ok-bg:#16332A; --warn:#F2B661; --warn-bg:#3A2C14; --bad:#FF8A80; --bad-bg:#3D1C1A;
  --tealbg:#163538; --on-teal:#0B1C1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --teal:#3DB6BF; --teal-ink:#7FD3D9; --mist:#2A2F33; --char:#C9CCD1;
  --bg:#151719; --card:#1E2124; --fg:#ECEEF0; --muted:#A3A8AE; --line:#343A3F;
  --ok:#6FD39E; --ok-bg:#16332A; --warn:#F2B661; --warn-bg:#3A2C14; --bad:#FF8A80; --bad-bg:#3D1C1A;
  --tealbg:#163538; --on-teal:#0B1C1E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.45;margin:0}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px;display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.7rem;font-weight:800}
h2{font-size:1.2rem;font-weight:600}
p{margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-ink);font-weight:700}
.test{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:.9rem;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted);font-size:.92rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.row>button{align-self:stretch}
.stack{display:flex;flex-direction:column;gap:10px}
button,.btn{font:inherit;font-weight:700;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:13px 16px;min-height:50px;cursor:pointer;text-align:center}
.btn.pick{position:relative;display:block;overflow:hidden}.btn.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
button.primary,.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.link{background:none;border:none;color:var(--teal-ink);padding:6px 0;min-height:0;text-align:left}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.full{width:100%}
.listbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;font-weight:400}
.listbtn b{font-weight:700}
label{font-weight:700;font-size:.95rem;display:flex;flex-direction:column;gap:6px}
input,select,textarea{font:inherit;font-weight:400;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
input[type=checkbox]{width:24px;height:24px;flex:none}
.check{flex-direction:row;align-items:center;gap:10px;font-weight:400}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:700;white-space:nowrap;background:var(--mist);color:var(--char)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.teal{background:var(--tealbg);color:var(--teal-ink)}
.num{font-variant-numeric:tabular-nums}
.big{font-family:var(--f-display);font-size:2rem;font-weight:800}
.bar{height:8px;background:var(--mist);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.photo-in{display:none}
.pin{display:flex;gap:10px;justify-content:center}
.pin span{width:16px;height:16px;border-radius:50%;border:2px solid var(--teal)}
.pin span.f{background:var(--teal)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{font-size:1.4rem;min-height:62px}
.users{display:grid;gap:10px}
.notice{border-left:4px solid var(--teal);background:var(--tealbg);padding:10px 12px;border-radius:8px;font-size:.95rem}
.notice.warn{border-color:var(--warn);background:var(--warn-bg)}
.notice.bad{border-color:var(--bad);background:var(--bad-bg)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal .card{width:100%;max-width:520px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--char);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-weight:700;max-width:90%}
.log{font-size:.88rem}
.logo{width:48px;height:48px;border-radius:50%;flex:none}
.biglogo{width:150px;height:150px;border-radius:50%;align-self:center}
</style>

// ---------- storage (IndexedDB) ----------
let db, S, me = null, lastAction = Date.now(), hiddenAt = 0;
let view = {name:"home"};
const urls = {};

function openDb(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open("nc-stock-check",1);
    r.onupgradeneeded = ()=>{ const d=r.result; d.createObjectStore("kv"); d.createObjectStore("photos"); };
    r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error);
  });
}
function tx(store, mode, fn){
  return new Promise((res,rej)=>{
    const t = db.transaction(store, mode); const st = t.objectStore(store);
    let out; const q = fn(st); if(q) q.onsuccess = ()=>{ out = q.result; };
    t.oncomplete = ()=>res(out); t.onerror = ()=>rej(t.error); t.onabort = ()=>rej(t.error);
  });
}
const kvGet = k => tx("kv","readonly",s=>s.get(k));
const kvPut = (k,v) => tx("kv","readwrite",s=>s.put(v,k));
const photoGet = id => tx("photos","readonly",s=>s.get(id));
const photoPut = (id,blob) => tx("photos","readwrite",s=>s.put(blob,id));
async function save(){ await kvPut("state", S); }

function blankState(){
  const items=[], locations=[];
  SEED_ITEMS.forEach(([name,unit,locs],i)=>{
    const id="I"+(i+1); items.push({id,name,unit});
    locs.forEach((label,j)=>locations.push({id:id+"L"+(j+1),itemId:id,label,active:true}));
  });
  return migrate({v:1, users:USERS.map(u=>({...u,salt:null,hash:null})), items, locations, sessions:[], log:[]});
}
// bring records saved by an older version up to date without losing anything
function migrate(st){
  if(!st.v || st.v<2){ st.users.forEach(u=>{ if((u.id==="dom"||u.id==="ester") && u.role==="staff") u.role="manager"; }); st.v=2; }
  st.finals ||= []; st.removed ||= [];
  st.sessions.forEach(x=>{ x.tasks ||= []; });
  st.items.forEach(i=>{ if(i.strength===undefined) i.strength=guessStrength(i.name); if(!i.category) i.category="Uncategorised"; });
  return st;
}
// strength or size written in the item name, e.g. "500mg", "250mg/5ml", "1%W/W", "5CMX4.5CM"
function guessStrength(name){
  const n=String(name||"");
  const size=n.match(/\d+(?:\.\d+)?\s?cm\s?x\s?\d+(?:\.\d+)?\s?(?:cm|m)\b/i); if(size) return size[0];
  const re=/\d+(?:\.\d+)?\s?(?:mg|mcg|µg|gm|g|ml|iu|units?|%)(?:\s?\/\s?\d*(?:\.\d+)?\s?(?:mg|mcg|g|ml|dose|tab))?(?:\s?w\/[wv])?(?![a-z])/gi;
  return (n.match(re)||[]).join(" / ");
}

// exact decimal maths on strings: count to 3 decimal places as integers
function toMilli(s){ s=String(s).trim(); if(!/^-?\d+(\.\d{1,3})?$/.test(s)) return null; const neg=s.startsWith("-"); const [a,b=""]=s.replace("-","").split("."); return (neg?-1:1)*(parseInt(a,10)*1000+parseInt((b+"000").slice(0,3),10)); }
function fromMilli(m){ const neg=m<0; m=Math.abs(m); const a=Math.floor(m/1000), b=m%1000; return (neg?"-":"")+a+(b?("."+String(b).padStart(3,"0").replace(/0+$/,"")):""); }

async function photoUrl(id){
  if(!id) return "";
  if(urls[id]) return urls[id];
  const b = await photoGet(id); if(!b) return "";

}
async function shrink(file){
  let bmp;
  try{ bmp = await createImageBitmap(file, {imageOrientation:"from-image"}); }
  catch(e){ bmp = await createImageBitmap(file); }
  const max=1280, k=Math.min(1, max/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",0.72));
}

// Klinify Inventory Status Report reader: uses text positions from pdf.js to rebuild table rows.
const KLINIFY_COLS = [["expiry",/^Expiry/i],["name",/^SKU/i],["batch",/^Batch/i],["count",/^Count$/i],["demand",/^Demand/i],["days",/^Days/i],["cost",/^Inventory$/i],["unitCost",/^Unit$/i],["unit",/^Dispensation/i],["maker",/^Manufacturer/i],["tags",/^Tags$/i]];
const DATE_RE=/^\d{2}\/\d{2}\/\d{4}$/, NUM_RE=/^-?[\d,]+(\.\d+)?$/;
function klinifyPageRows(items){
  // items: [{str,x,y,w}] y grows upward (PDF coordinates)
  const toks=[];
  for(const it of items){ const s=it.str.replace(/\u0002/g,'-'); if(!s.trim()) continue; toks.push({...it,str:s.trim()}); }
  // header: find "SKU" token, header band = tokens within a few lines of it
  const sku=toks.find(t=>/^SKU/.test(t.str)); if(!sku) return null;
  const HW=/^(Expiry|Date|SKU|Name|Batch|Id|Count|Demand\/?|Day|Demand\/Day|Days|of|Stock|Left|Inventory|Cost|Unit|Dispensation|Manufacturer|Tags)$/i;
  const band=toks.filter(t=>Math.abs(t.y-sku.y)<30 && t.str.split(/\s+/).every(w=>HW.test(w)));
  const cols=[];
  for(const [key,re] of KLINIFY_COLS){
    let c=band.filter(t=>re.test(t.str));
    if(key==="unitCost") c=c.filter(t=>band.some(o=>/^Cost$/.test(o.str)&&Math.abs(o.x-t.x)<4)||/Cost/.test(t.str));
    if(key==="days") c=c.slice(0,1);
    if(!c.length){ if(key==="tags"||key==="maker"||key==="unitCost"||key==="cost"||key==="demand"||key==="days") continue; return null; }
    cols.push({key,x:Math.min(...c.map(t=>t.x))});
  }
  cols.sort((a,b)=>a.x-b.x);
  const headTop=Math.max(...band.map(t=>t.y)), headBottom=Math.min(...band.map(t=>t.y));
  const colOf=t=>{ let k=null; for(const c of cols){ if(t.x>=c.x-3) k=c.key; } return k; };
  const body=toks.filter(t=>t.y<headBottom-2 && !/Inventory Status Report|^about:blank|^\d{1,2}\/\d{1,2}\/\d{2}, \d/.test(t.str));
  // a token holding several space-separated values across columns is split by estimated character width
  const cells=[];
  for(const t of body){
    const parts=t.str.split(/\s+/);
    const c=colOf(t);
    if(parts.length>1 && c!=="name" && c!=="maker" && c!=="unit" && parts.every(p=>p==="—"||NUM_RE.test(p)||/^RM/.test(p)||DATE_RE.test(p))){
      const cw=t.w/t.str.length; let off=0;
      for(const p of parts){ const sub={...t,str:p,x:t.x+off*cw}; cells.push({...sub,col:colOf(sub)}); off+=p.length+1; }
    } else cells.push({...t,col:c});
  }
  const anchors=cells.filter(t=>t.col==="expiry" && (DATE_RE.test(t.str)||t.str==="—")).sort((a,b)=>b.y-a.y);
  const rows=anchors.map(a=>({y:a.y, cells:{}}));
  if(!rows.length) return [];
  // Wrapped cells: lines in one column that sit closer than a row gap form one cell block,
  // and the whole block goes to the row whose anchor is nearest the block's middle.
  const carry={};
  const byCol={};
  for(const t of cells){ if(t.col) (byCol[t.col] ||= []).push(t); }
  // line spacing inside a wrapped cell, measured on the stacked header words (e.g. "Expiry" over "Date")
  let lineGap=Infinity;
  for(const a of band) for(const b of band){ const g=a.y-b.y; if(g>4 && Math.abs(a.x-b.x)<2 && g<lineGap) lineGap=g; }
  if(!isFinite(lineGap)) lineGap=13;
  let minAnchor=Infinity; for(let i=1;i<rows.length;i++) minAnchor=Math.min(minAnchor, rows[i-1].y-rows[i].y);
  const joinGap=Math.min(lineGap*1.35, isFinite(minAnchor)?minAnchor*0.8:Infinity);
  for(const arr of Object.values(byCol)){
    arr.sort((a,b)=>(b.y-a.y)||(a.x-b.x));
    let block=[];
    const flush=()=>{ if(!block.length) return; const mid=(block[0].y+block[block.length-1].y)/2;
      let best=0, bd=Infinity; rows.forEach((r,i)=>{ const d=Math.abs(r.y-mid); if(d<bd){bd=d;best=i;} });
      // text above the first row that is not centred on it is the tail of a row cut at the previous page break
      const target = (best===0 && mid-rows[0].y > joinGap*0.9) ? carry : rows[best].cells;
      for(const t of block) (target[t.col] ||= []).push(t); block=[]; };
    for(const t of arr){ if(block.length && (block[block.length-1].y - t.y) > joinGap) flush(); block.push(t); }
    flush();
  }
  const txt=cs=>{ const o={}; for(const [k,arr] of Object.entries(cs)){ arr.sort((a,b)=>(b.y-a.y)||(a.x-b.x)); o[k]=arr.map(t=>t.str).join(' ').replace(/\s+/g,' ').replace(/- (?=[A-Z])/g,'-').trim(); } return o; };
  const out=rows.map(r=>txt(r.cells));
  if(Object.keys(carry).length) out.unshift({...txt(carry), carry:true});
  return out;
  return rows.map(r=>{ const o={}; for(const [k,arr] of Object.entries(r.cells)){ arr.sort((a,b)=>(b.y-a.y)||(a.x-b.x)); o[k]=arr.map(t=>t.str).join(' ').replace(/\s+/g,' ').replace(/- (?=[A-Z])/g,'-').trim(); } return o; });
}
function klinifyItems(rows){
  const merged=[];
  for(const r of rows){
    if(r.carry){ const prev=merged[merged.length-1]; if(prev){ for(const [k,v] of Object.entries(r)){ if(k!=='carry' && v) prev[k]=((prev[k]||'')+' '+v).trim(); } } continue; }
    merged.push({...r});
  }
  rows=merged;
  const items=[]; let cur=null;
  // A summary row (expiry, batch and count all "—") starts each item; batch rows follow it, even across pages.
  const first=s=>s.split(/\s+/)[0].toLowerCase();
  for(const r of rows){
    const name=(r.name||'').trim(), unit=(r.unit||'').trim(); if(!name) continue;
    const summary=r.expiry==='—' && (r.batch||'—')==='—' && (r.count||'—')==='—';
    const same=cur && (name+'|'+unit).toLowerCase()===(cur.name+'|'+cur.unit).toLowerCase();
    if(!cur || (summary && !same) || (!summary && first(name)!==first(cur.name))){ cur={name,unit,rows:[]}; items.push(cur); }
    cur.rows.push(r);
  }
  const out=[];
  for(const it of items){
    const f=it.rows[0];
    const batches=(f.expiry==='—'&&(f.batch||'—')==='—'&&(f.count||'—')==='—'&&it.rows.length>1)?it.rows.slice(1):it.rows;
    const shown=batches.filter(b=>b.count && b.count!=='—' && NUM_RE.test(b.count));
    const odd=batches.filter(b=>b.count && b.count!=='—' && !NUM_RE.test(b.count));
    let total=null; if(shown.length){ let m=0; for(const b of shown){ const t=b.count.replace(/,/g,''); const neg=t.startsWith('-'); const [a,c='']=t.replace('-','').split('.'); m+=(neg?-1:1)*(parseInt(a,10)*1000+parseInt((c+'000').slice(0,3),10)); } const neg=m<0; m=Math.abs(m); total=(neg?'-':'')+Math.floor(m/1000)+(m%1000?'.'+String(m%1000).padStart(3,'0').replace(/0+$/,''):''); }
    const plus=batches.filter(b=>b.count&&/^[\d]/.test(b.count)); const minusRows=batches.filter(b=>b.count&&/^-/.test(b.count)).length;
    let plusTotal=null; if(minusRows&&plus.length){ let m=0; for(const b of plus){ const [a,c='']=b.count.replace(/,/g,'').split('.'); m+=parseInt(a,10)*1000+parseInt((c+'000').slice(0,3),10);} plusTotal=Math.floor(m/1000)+(m%1000?'.'+String(m%1000).padStart(3,'0').replace(/0+$/,''):''); }
    out.push({name:it.name, unit:it.unit, total, minusRows, plusTotal, batches:batches.map(b=>({expiry:b.expiry,batch:b.batch||'—',count:b.count||'—'})), unreadable:odd.length>0});
  }
  // merge items that were split across a page break (same name+unit, adjacent, second has no summary row)
  return out;
}


// ---------- Klinify PDF import ----------
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
function loadScript(src){ return new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src=src; sc.onload=res; sc.onerror=()=>rej(new Error("Could not load the PDF reader. Check the internet connection and try again.")); document.head.appendChild(sc); }); }
async function loadPdfJs(){
  if(window.pdfjsLib && window.pdfjsWorker) return window.pdfjsLib;
  await loadScript(PDFJS+"pdf.min.js"); await loadScript(PDFJS+"pdf.worker.min.js");
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS+"pdf.worker.min.js";
  return window.pdfjsLib;
}
async function readKlinifyPdf(file, onPage){
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  let rows=[], printed=null, noHeader=0;
  for(let i=1;i<=doc.numPages;i++){
    const pg=await doc.getPage(i); const tc=await pg.getTextContent();
    const items=tc.items.map(t=>({str:t.str, x:t.transform[4], y:t.transform[5], w:t.width}));
    if(!printed){ const f=items.find(t=>/^\d{1,2}\/\d{1,2}\/\d{2}, \d{1,2}:\d{2} [AP]M/.test(t.str.trim())); if(f) printed=f.str.trim(); }
    const r=klinifyPageRows(items); if(r===null) noHeader++; else rows=rows.concat(r);
    pg.cleanup(); if(onPage) onPage(i, doc.numPages);
  }
  if(!rows.length) throw new Error("This does not look like a Klinify Inventory Status Report. Print it from Inventory Status and choose that PDF.");
  // footer time is in the browser's M/D/YY h:mm AM format
  let printedAt=null;
  if(printed){ const m=printed.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}), (\d{1,2}):(\d{2}) ([AP])M/); if(m){ let h=+m[4]%12+(m[6]==="P"?12:0); printedAt=new Date(`20${m[3]}-${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")}T${String(h).padStart(2,"0")}:${m[5]}:00+08:00`).toISOString(); } }
  return {items:klinifyItems(rows), pages:doc.numPages, noHeader, printedAt};
}
function isoToLocalInput(iso){ if(!iso) return ""; const d=new Date(new Date(iso).getTime()+8*3600000); return d.toISOString().slice(0,16); }

// ---------- crypto ----------
const enc = new TextEncoder();
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pbkdf2(secret, salt, iters=150000){
  const key = await crypto.subtle.importKey("raw", enc.encode(secret), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:iters,hash:"SHA-256"}, key, 256);
}
async function setPin(u, pin){ const salt=crypto.getRandomValues(new Uint8Array(16)); u.salt=b64(salt); u.hash=b64(await pbkdf2(pin,salt)); }
async function checkPin(u, pin){ if(!u.hash) return false; return b64(await pbkdf2(pin, unb64(u.salt))) === u.hash; }
async function aesKey(pass, salt){ const bits=await pbkdf2(pass,salt,300000); return crypto.subtle.importKey("raw",bits,"AES-GCM",false,["encrypt","decrypt"]); }

// ---------- views ----------
function header(title, back=true){
  return `<div class="top"><div class="row" style="gap:10px"><img class="logo" src="${LOGO}" alt="Nazren's Clinic Stock Manager logo"><div class="brand">Nazren's Clinic<br>Stock Manager</div></div>${me?`<button class="link" data-act="logout">Sign out</button>`:""}</div>
  ${TEST_BUILD?`<div class="test">TEST VERSION · not an official record · nothing here changes Klinify</div>`:""}
  ${back?`<button class="link" data-act="go" data-v="home">← Home</button>`:""}
  <h1>${esc(title)}</h1>`;
}
function progress(sess){
  let total=0, done=0;
  sess.lines.forEach(l=>{ const locs=l.locIds; total+=locs.length; done+=locs.filter(id=>l.counts[id]).length; });
  return {total, done};
}
function lineStatus(l){
  if(l.result==null) return "";
  if(l.result==="NO_SOURCE") return `<span class="chip warn">PROVISIONAL · no Klinify figure</span>`;
  if(l.result==="0") return `<span class="chip ok">Match</span>`;
  const r=l.review;
  if(!l.recount) return `<span class="chip bad">Difference · recount needed</span>`;
  if(!r || r.status==="pending") return `<span class="chip warn">Waiting for Dr Nazren</span>`;
  if(r.status==="returned") return `<span class="chip bad">Sent back</span>`;
  if(r.decision==="adjust" && !r.klinifyRef) return `<span class="chip warn">Approved · Klinify ref needed</span>`;
  return `<span class="chip ok">Closed</span>`;
}

// ---------- final valuation for Accounts ----------
function costTT(c){ const m=String(c||"").trim().match(/^(\d+)(?:\.(\d{1,4}))?$/); return m? BigInt(m[1])*10000n+BigInt((m[2]||"").padEnd(4,"0")) : null; }
// value in sen from a quantity (3 decimals) and a unit cost (4 decimals), rounded half up
function valueSen(qty, cost){ const ct=costTT(cost), qm=toMilli(qty); if(ct===null||qm===null) return null; const prod=BigInt(qm)*ct; return Number((prod*2n+100000n)/200000n); }
const money = sen => (sen/100).toLocaleString("en-MY",{minimumFractionDigits:2, maximumFractionDigits:2});
function nearestExpiry(batches){
  const ds=(batches||[]).filter(b=>DATE_RE.test(b.expiry||"")).map(b=>({b, key:b.expiry.split("/").reverse().join("")})).filter(x=>x.key<"20990101");
  const withStock=ds.filter(x=>NUM_RE.test(x.b.count||"") && !String(x.b.count).startsWith("-") && toMilli(String(x.b.count).replace(/,/g,""))>0);
  const pool=withStock.length?withStock:ds; if(!pool.length) return "";
  return pool.sort((a,b)=>a.key<b.key?-1:1)[0].b.expiry;
}
function valuationCard(s){
  const fin=S.finals.find(f=>f.sessionId===s.id);
  if(fin) return `<div class="card"><h2>Final stock valuation</h2><p class="muted">Finalised by ${esc(userName(fin.by))} · ${fmt(fin.at)} · ${esc(fin.period)}</p>
    <p><b class="num">RM ${money(fin.totalSen)}</b> <span class="muted">for ${fin.rows.length-fin.missing} item(s) with a unit cost</span></p>${fin.missing?`<div class="notice warn">${fin.missing} item(s) cost missing, not counted in the total</div>`:""}
    ${can("export")?`<button class="primary" data-act="exportxlsx" data-f="${fin.id}">Export Excel for Accounts</button>`:""}</div>`;
  if(!can("export")) return "";
  const open=s.lines.filter(l=>!lineClosed(l)).length;
  return `<div class="card"><h2>Final stock valuation</h2>${open?`<p class="muted">${open} item(s) still need a recount or Dr Nazren's decision before this count can be finalised for Accounts.</p>`:`<p class="muted">Saves the verified quantities and current unit costs as a fixed record for Accounts.</p><button class="primary" data-act="finalise">Finalise for Accounts</button>`}</div>`;
}
function buildFinal(s, period){
  const rows=[]; let skipped=0;
  s.lines.forEach((l,i)=>{
    const it=item(l.itemId); if(!it || it.archived){ skipped++; return; }
    const approved=l.review&&l.review.status==="approved";
    const counters=[...new Set(l.locIds.map(id=>(l.counts[id]||{}).by).concat(approved&&l.recount?[l.recount.by]:[]).filter(Boolean))];
    let verifiers=liveTasks(s).filter(t=>t.slots.some(x=>x.i===i)).map(t=>t.verifiedBy).filter(Boolean);
    if(approved) verifiers.push(l.review.by);
    if(!verifiers.length && s.finishedBy) verifiers.push(s.finishedBy);
    rows.push({name:it.name, category:it.category||"Uncategorised", strength:it.strength||"", unit:l.unit,
      locations:l.locIds.map(id=>(S.locations.find(o=>o.id===id)||{}).label).filter(Boolean).join("; "),
      qty:finalQty(l), unitCost:it.unitCost||"", expiry:nearestExpiry(l.batches), countedBy:namesOf(counters), verifiedBy:namesOf([...new Set(verifiers)])});
  });
  rows.sort((a,b)=>a.category.localeCompare(b.category)||a.name.localeCompare(b.name));
  let totalSen=0, missing=0; rows.forEach(r=>{ const v=valueSen(r.qty,r.unitCost); if(v===null) missing++; else totalSen+=v; });
  return {id:uid("F"), sessionId:s.id, at:now(), by:me.id, period, countType:s.type, countDate:s.createdAt, rows, totalSen, missing, skipped, test:TEST_BUILD};
}
const EXCELJS = ["https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js","https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"];
async function loadExcelJs(){
  if(window.ExcelJS) return window.ExcelJS;
  for(const u of EXCELJS){ try{ await loadScript(u); if(window.ExcelJS) return window.ExcelJS; }catch(e){} }
  throw new Error("Could not load the Excel maker. Check the internet connection and try again.");
}
async function makeWorkbook(fin){
  const ExcelJS=await loadExcelJs();
  const wb=new ExcelJS.Workbook(); wb.creator="NC Stock Manager"; wb.created=new Date();
  const RM='"RM" #,##0.00', QTY='#,##0.###', bold={bold:true};
  const sumWs=wb.addWorksheet("Accounts Summary"), ws=wb.addWorksheet("Stock Valuation");
  const title=`Nazren's Clinic: Final Stock Valuation${fin.test?" (TEST VERSION, not an official record)":""}`;
  const info=[["Stock-take date", dmy(fin.at)],["Reporting period", fin.period],["Count", `${fin.countType} count started ${dmy(fin.countDate)}`],["Finalised by", `${userName(fin.by)} on ${fmt(fin.at)}`]];
  // valuation sheet
  ws.getCell("A1").value=title; ws.getCell("A1").font={bold:true,size:14};
  info.forEach(([k,v],j)=>{ ws.getCell(3+j,1).value=k; ws.getCell(3+j,1).font=bold; ws.getCell(3+j,2).value=v; });
  const H=["Item Number","Medication / Stock Item Name","Category","Strength / Specification","Unit of Measurement","Storage Location","Final Verified Quantity","Unit Cost (RM)","Total Stock Value (RM)","Expiry Date","Counted By","Verified By","Date of Finalisation","Cost Status"];
  const hr=8; ws.getRow(hr).values=H; ws.getRow(hr).font=bold; ws.getRow(hr).alignment={wrapText:true,vertical:"top"};
  ws.getRow(hr).eachCell(c=>{ c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFDDF1F2"}}; c.border={bottom:{style:"thin"}}; });
  [10,40,18,18,14,24,14,14,18,12,18,18,14,14].forEach((w,j)=>ws.getColumn(j+1).width=w);
  let r=hr+1, no=0; const subRows=[], cats=[];
  const byCat={}; fin.rows.forEach(x=>(byCat[x.category] ||= []).push(x));
  for(const cat of Object.keys(byCat)){
    const first=r; let catSen=0, catMissing=0;
    for(const x of byCat[cat]){
      no++; const v=valueSen(x.qty,x.unitCost); if(v===null) catMissing++; else catSen+=v;
      const row=ws.getRow(r);
      row.values=[no, x.name, x.category, x.strength, x.unit, x.locations, Number(x.qty), x.unitCost===""?null:Number(x.unitCost), null, x.expiry, x.countedBy, x.verifiedBy, dmy(fin.at), null];
      row.getCell(9).value={formula:`IF(H${r}="","",G${r}*H${r})`, result: v===null?"":v/100};
      row.getCell(14).value={formula:`IF(H${r}="","Cost Missing","")`, result: v===null?"Cost Missing":""};
      if(v===null) row.getCell(14).fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFCEFD9"}};
      row.getCell(7).numFmt=QTY; row.getCell(8).numFmt='"RM" #,##0.00##'; row.getCell(9).numFmt=RM;
      r++;
    }
    const sr=ws.getRow(r); sr.getCell(2).value=`Subtotal: ${cat}`; sr.getCell(9).value={formula:`SUM(I${first}:I${r-1})`, result:catSen/100}; sr.getCell(9).numFmt=RM;
    sr.getCell(14).value={formula:`IF(COUNTIF(N${first}:N${r-1},"Cost Missing")>0,COUNTIF(N${first}:N${r-1},"Cost Missing")&" cost missing","")`, result: catMissing?`${catMissing} cost missing`:""};
    sr.font=bold; sr.eachCell(c=>c.border={top:{style:"thin"}});
    subRows.push(r); cats.push({cat, n:byCat[cat].length, first, last:r-1, sub:r, sen:catSen, missing:catMissing}); r+=2;
  }
  const gr=ws.getRow(r); gr.getCell(2).value="GRAND TOTAL (RM)";
  gr.getCell(9).value={formula: subRows.length?subRows.map(x=>`I${x}`).join("+"):"0", result: fin.totalSen/100}; gr.getCell(9).numFmt=RM; gr.font={bold:true,size:12};
  ws.views=[{state:"frozen", ySplit:hr}]; ws.autoFilter={from:{row:hr,column:1}, to:{row:hr,column:H.length}};
  ws.pageSetup={orientation:"landscape", fitToPage:true, fitToWidth:1, fitToHeight:0};
  // summary sheet
  sumWs.getCell("A1").value=title; sumWs.getCell("A1").font={bold:true,size:14};
  info.concat([["Exported", `${fmt(now())} by ${userName(me.id)}`]]).forEach(([k,v],j)=>{ sumWs.getCell(3+j,1).value=k; sumWs.getCell(3+j,1).font=bold; sumWs.getCell(3+j,2).value=v; });
  const th=10; sumWs.getRow(th).values=["Category","Items","Items with cost missing","Stock value (RM)"]; sumWs.getRow(th).font=bold;
  sumWs.getRow(th).eachCell(c=>{ c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFDDF1F2"}}; c.border={bottom:{style:"thin"}}; });
  [32,10,22,20].forEach((w,j)=>sumWs.getColumn(j+1).width=w);
  let sr=th+1;
  for(const c of cats){
    const row=sumWs.getRow(sr); row.values=[c.cat, c.n, null, null];
    row.getCell(3).value={formula:`COUNTIF('Stock Valuation'!N${c.first}:N${c.last},"Cost Missing")`, result:c.missing};
    row.getCell(4).value={formula:`'Stock Valuation'!I${c.sub}`, result:c.sen/100}; row.getCell(4).numFmt=RM; sr++;
  }
  const tr=sumWs.getRow(sr); tr.values=["GRAND TOTAL", null, null, null]; tr.font=bold;
  tr.getCell(2).value={formula:cats.length?`SUM(B${th+1}:B${sr-1})`:"0", result:fin.rows.length};
  tr.getCell(3).value={formula:cats.length?`SUM(C${th+1}:C${sr-1})`:"0", result:fin.missing};
  tr.getCell(4).value={formula:cats.length?`SUM(D${th+1}:D${sr-1})`:"0", result:fin.totalSen/100}; tr.getCell(4).numFmt=RM;
  tr.eachCell(c=>c.border={top:{style:"thin"}});
  const notes=["Total stock value = Final verified quantity × Unit cost.",
    fin.missing?`${fin.missing} item(s) have no unit cost and are marked Cost Missing. They are not included in the total. Enter the cost in column H of Stock Valuation and the totals update automatically.`:"Every item has a unit cost.",
    "Only quantities from the finalised, verified count are included. Each item appears once; stock kept in several places is added together.",
    "Klinify remains the clinic's stock record. This report does not change Klinify."];
  notes.forEach((t,j)=>{ const c=sumWs.getCell(sr+2+j,1); c.value=t; sumWs.mergeCells(sr+2+j,1,sr+2+j,4); c.alignment={wrapText:true}; sumWs.getRow(sr+2+j).height=t.length>90?32:18; });
  return wb;
}

function assignGroups(s,by){
  const groups={};
  s.lines.forEach((l,i)=>{ const it=item(l.itemId); if(!it||it.archived) return;
    freeLocs(s,i).forEach(loc=>{ if(l.counts[loc]) return;
      const key = by==="place" ? S.locations.find(o=>o.id===loc).label : by==="category" ? (it.category||"Uncategorised") : String(i);
      (groups[key] ||= {label: by==="items"?it.name:key, slots:[]}).slots.push({i,loc}); }); });
  return groups;
}

// ---------- unit costs from a Klinify Inventory Status table copied into Excel ----------
const normName = n => String(n||"").replace(/- (?=[a-z])/gi,"-").replace(/\s+/g," ").trim().toLowerCase();
const cellText = v => v==null ? "" : typeof v==="object" ? (v.richText?v.richText.map(t=>t.text).join(""):v.text!=null?String(v.text):v.result!=null?String(v.result):"") : String(v);
async function readCostWorkbook(file){
  const ExcelJS=await loadExcelJs(); const wb=new ExcelJS.Workbook(); await wb.xlsx.load(await file.arrayBuffer());
  const rows=[];
  wb.eachSheet(ws=>{
    let col=null;
    ws.eachRow({includeEmpty:false}, row=>{
      const vals=[]; row.eachCell({includeEmpty:true},(c,i)=>{ vals[i]=cellText(c.value).trim(); });
      if(!col){ const f=t=>vals.findIndex(v=>v&&v.toLowerCase()===t); const n=f("sku name"), c=f("unit cost"); if(n>0&&c>0) col={n, c, u:f("dispensation unit")}; return; }
      const raw=vals[col.n]; if(!raw) return;
      const name=raw.replace(/\s\(\d+\)$/,"").trim(); // Klinify adds the batch count in brackets
      const num=Number(String(vals[col.c]||"").replace(/[^\d.\-]/g,""));
      rows.push({name, unit: col.u>0?(vals[col.u]||""):"", cost: isFinite(num)?num:0});
    });
  });
  if(!rows.length) throw new Error("No Klinify table found. The file needs the SKU Name and Unit Cost columns from Inventory Status.");
  const active=S.items.filter(i=>!/^TEST /.test(i.name));
  const byNU=new Map(), byN=new Map();
  active.forEach(i=>{ byNU.set(normName(i.name)+"|"+String(i.unit||"").toLowerCase(), i); const k=normName(i.name); byN.set(k, byN.has(k)?null:i); });
  const changes=[], same=[], zero=[], notFound=[], seen=new Set();
  for(const r of rows){
    const it=byNU.get(normName(r.name)+"|"+r.unit.toLowerCase()) || byN.get(normName(r.name));
    if(!it){ notFound.push(r.name); continue; }
    seen.add(it.id);
    if(!(r.cost>0)){ zero.push(it.name); continue; }
    const cost=String(Math.round(r.cost*10000)/10000);
    if(it.unitCost===cost) same.push(it.name); else changes.push({id:it.id, name:it.name, unit:it.unit, from:it.unitCost||"", to:cost});
  }
  const missingFromFile=active.filter(i=>!i.archived && !seen.has(i.id)).map(i=>i.name);
  return {file:file.name, rows:rows.length, changes, same, zero, notFound, missingFromFile};
}

    <div class="row"><button class="link" data-act="addloc" data-id="${i.id}">+ Add a place</button>${mgr?` · <button class="link" data-act="editdetails" data-id="${i.id}">Edit details</button> · <button class="link" data-act="archone" data-id="${i.id}">Archive</button>`:""}</div></div>`).join("")}
  ${all.length>60?`<p class="muted">Showing 60 of ${all.length} items. Search to find others.</p>`:""}
  ${mgr?`<div class="card"><h2>Add an item</h2><label for="niname">Item name (as in Klinify)<input id="niname" data-act="niname" value="${esc(view.niname||"")}"></label><label for="niunit">Unit<input id="niunit" data-act="niunit" value="${esc(view.niunit||"")}" placeholder="TABLET, BOX, VIAL…"></label><button data-act="additem">Add item</button></div>`:""}
  ${mgr&&archived.length?`<button class="full" data-act="showarch">${view.showArch?"Hide":"Show"} archived items (${archived.length})</button>`:""}
  ${mgr&&view.showArch?archived.filter(i=>i.name.toLowerCase().includes(q)).map(i=>{ const a=i.archivedInfo||{}; const used=S.sessions.some(x=>x.lines.some(l=>l.itemId===i.id));
    return `<div class="card"><div class="row between"><b>${esc(i.name)}</b><span class="chip">${esc(i.status||"Archived")}</span></div>
    <p class="muted">${a.by?`${esc(userName(a.by))} · ${fmt(a.at)} · `:""}${esc(a.reason||"")}</p>
    <div class="row"><button style="flex:1" data-act="restoreitem" data-id="${i.id}">Restore</button>${used?"":`<button style="flex:1" class="danger" data-act="delitem" data-id="${i.id}">Delete permanently</button>`}</div>
    ${used?`<p class="muted">Used in past counts, so it can only be archived, not deleted.</p>`:""}</div>`; }).join(""):""}
  <p class="muted">Every change is logged for Dr Nazren's review.</p>`;
}

async function render(){
  const app=$("#app");
  try{
    let h;
    if(!me){ h = view.name==="pin"?vPin():view.name==="restore"?vRestore():vLogin(); }
    else{
      const f={import:vImport,home:vHome,new:vNew,session:vSession,countitem:vCountItem,line:vLine,review:vReview,items:vItems,activity:vActivity,staff:vStaff,backup:vBackup,history:vHistory,task:vTask,assign:vAssign,costimport:vCostImport}[view.name]||vHome;
      const need={costimport:"items",import:"import",new:"prepare",assign:"assign",staff:"users",activity:"admin-only",backup:"admin-only"}[view.name];
      if(need && !can(need)) h=vHome(); else h=await f();
    }
    app.innerHTML = h;
  }catch(e){ console.error(e); app.innerHTML = header("Something went wrong", !!me) + `<div class="notice bad">${esc(e.message)}</div><p class="muted">Your saved records are safe.</p>`; }
}
function go(v){ view = typeof v==="string"?{name:v}:v; render().then(()=>window.scrollTo(0,0)); }

// ---------- modal ----------
function modal(html){ $("#modal").innerHTML = `<div class="modal"><div class="card">${html}</div></div>`; const i=$("#modal input"); if(i) i.focus(); }
function closeModal(){ $("#modal").innerHTML=""; }
function askText(title, label, value, onOk){
  modal(`<h2>${esc(title)}</h2><label for="mtext">${esc(label)}<input id="mtext" value="${esc(value||"")}"></label><div class="row"><button style="flex:1" data-act="mclose">Cancel</button><button style="flex:1" class="primary" data-act="mok">Save</button></div>`);
  window._mok = ()=>{ const v=$("#mtext").value.trim(); if(!v) return; closeModal(); onOk(v); };
}
function confirmBox(title, text, okLabel, onOk, danger){
  modal(`<h2>${esc(title)}</h2><p>${esc(text)}</p><div class="row"><button style="flex:1" data-act="mclose">Cancel</button><button style="flex:1" class="${danger?"danger":"primary"}" data-act="mok">${esc(okLabel)}</button></div>`);
  window._mok = ()=>{ closeModal(); onOk(); };
}
// Admin approval uses a separate, longer passphrase (not the 6-digit PIN)
function askAdminPin(onOk){
  const admin=S.users.find(u=>u.role==="admin");
  if(me.role!=="admin") return toast("Only Dr Nazren can do this.");
  if(!admin.apHash){
    modal(`<h2>Create your approval passphrase</h2><p class="muted">Used only to approve differences and reset staff PINs. At least 8 characters, different from your PIN.${TEST_BUILD?" Test version: do not use your real one.":""}</p><label for="ap1">Approval passphrase<input id="ap1" type="password" autocomplete="new-password"></label><label for="ap2">Type it again<input id="ap2" type="password" autocomplete="new-password"></label><div id="merr"></div><div class="row"><button style="flex:1" data-act="mclose">Cancel</button><button style="flex:1" class="primary" data-act="mok">Save and continue</button></div>`);
    window._mok = async ()=>{ const a=$("#ap1").value, b=$("#ap2").value;
      if(a.length<8) return $("#merr").innerHTML=`<div class="notice bad">Use at least 8 characters.</div>`;
      if(a!==b) return $("#merr").innerHTML=`<div class="notice bad">The two entries do not match.</div>`;
      if(/^\d{6}$/.test(a) && await checkPin(admin,a)) return $("#merr").innerHTML=`<div class="notice bad">Choose something different from your PIN.</div>`;
      const salt=crypto.getRandomValues(new Uint8Array(16)); admin.apSalt=b64(salt); admin.apHash=b64(await pbkdf2(a,salt)); log("Created approval passphrase"); await save(); closeModal(); onOk(); };
    return;
  }
  modal(`<h2>Confirm with your approval passphrase</h2><label for="mpin">Approval passphrase<input id="mpin" type="password" autocomplete="off"></label><div id="merr"></div><div class="row"><button style="flex:1" data-act="mclose">Cancel</button><button style="flex:1" class="primary" data-act="mok">Confirm</button></div>`);
  window._mok = async ()=>{ const v=$("#mpin").value; if(v && b64(await pbkdf2(v,unb64(admin.apSalt)))===admin.apHash){ closeModal(); onOk(); } else $("#merr").innerHTML=`<div class="notice bad">Wrong passphrase.</div>`; };
}

// ---------- actions ----------
let failCount = 0, lockUntil = 0;
async function act(a, el){
  const d = el.dataset; const sess = () => S.sessions.find(x=>x.id===view.id);
  switch(a){
    case "go": return go(d.v);
    case "logout": me=null; return go("home");
    case "mclose": return closeModal();
    case "mok": return window._mok && window._mok();
    case "pickuser": return go({name:"pin", user:d.id, pin:""});
    case "digit": case "del": {
      if(Date.now()<lockUntil){ view.err=`Too many wrong tries. Wait ${Math.ceil((lockUntil-Date.now())/1000)} seconds.`; return render(); }
      view.pin = a==="del" ? (view.pin||"").slice(0,-1) : ((view.pin||"")+d.d).slice(0,6); view.err="";
      if(view.pin.length<6) return render();
      const u=S.users.find(x=>x.id===view.user);
      if(!u.hash){
        if(!view.first){ view.first=view.pin; view.pin=""; return render(); }
        if(view.first!==view.pin){ view.first=null; view.pin=""; view.err="PINs did not match. Choose again."; return render(); }
        await setPin(u, view.pin); me=u; log("Set PIN and signed in"); await save(); touch(); return go("home");
      }
      if(await checkPin(u, view.pin)){ failCount=0; me=u; log("Signed in"); await save(); touch(); return go("home"); }
      failCount++; if(failCount>=5){ lockUntil=Date.now()+30000*Math.pow(2,failCount-5); }
      view.pin=""; view.err="Wrong PIN."; return render();
    }
    case "askreset": return confirmBox("Erase all test data?","This removes every test count, photo and PIN on this phone. Use only in the test version.","Erase", async ()=>{ await tx("photos","readwrite",s=>s.clear()); S=blankState(); await save(); me=null; go("home"); }, true);
    // new count
    case "ctype": view.type=el.value; if(el.value==="Monthly full"){ view.sel={}; S.items.filter(i=>!i.archived).forEach(i=>view.sel[i.id]=true);} return render();
    case "sel": view.sel=view.sel||{}; view.sel[d.id]=el.checked; return render();
    case "selall": { const items=S.items.filter(i=>!i.archived); const all=items.every(i=>(view.sel||{})[i.id]); view.sel={}; if(!all) items.forEach(i=>view.sel[i.id]=true); return render(); }
    case "create": {
      if(!can("prepare")) return;
      const ids=Object.keys(view.sel||{}).filter(k=>view.sel[k]);
      for(const id of ids){ if(!activeLocs(id).length){ S.locations.push({id:uid("L"),itemId:id,label:"Place not set yet",active:true}); } }
      const rep=S.report;
      const s={id:uid("S"), type:view.type||"Weekly", createdAt:now(), preparer:me.id, status:"preparing", sourcePhoto:null, tasks:[],
        reportFile: rep?rep.file:null, sourceAt: rep?rep.printedAt:null, sourceAtLocal: rep?isoToLocalInput(rep.printedAt):"", scope: rep?"Klinify Inventory Status Report (printed PDF)":"",
        lines: ids.map(id=>{ const it=item(id); const k=rep&&it.klinify&&it.klinify.reportId===rep.id?it.klinify:null;
          return {itemId:id, expected:k&&k.total!==null?k.total:"", fromReport:!!k, batches:k?k.batches:null, plusTotal:k?k.plusTotal:null, minusRows:k?k.minusRows:0, unit:it.unit, locIds:activeLocs(id).map(l=>l.id), counts:{}, total:null, result:null}; })};
      S.sessions.unshift(s); log(`Started ${s.type} count with ${ids.length} items`); await save(); view.sel={}; return go({name:"session", id:s.id});
    }
    case "selshown": { view.sel=view.sel||{}; const q=(view.nq||"").toLowerCase(); S.items.filter(i=>!i.archived&&i.name.toLowerCase().includes(q)).forEach(i=>view.sel[i.id]=true); return render(); }
    case "selnone": view.sel={}; return render();
    case "nq": view.nq=el.value; await render(); { const i=$("#nq"); i.focus(); i.setSelectionRange(i.value.length,i.value.length); } return;
    case "iq": view.iq=el.value; await render(); { const i=$("#iq"); i.focus(); i.setSelectionRange(i.value.length,i.value.length); } return;
    case "importpdf": {
      if(!can("import")) return; const inp=el; { const f=inp.files&&inp.files[0]; if(!f) return;
        view.busy="Opening PDF…"; render();
        try{ const r=await readKlinifyPdf(f,(i,n)=>{ if(i%5===0||i===n){ view.busy=`Reading page ${i} of ${n}…`; const b=$("[data-act=importpdf]"); if(b) b.textContent=view.busy; } });
          r.file=f; view.result=r; }
        catch(e){ toast(e.message); }
        view.busy=""; render(); }
      return;
    }
    case "importsave": {
      const r=view.result; if(!r || !can("import")) return;
      const fileId=uid("R"); await photoPut(fileId, r.file);
      const repId=uid("K");
      S.report={id:repId, file:fileId, printedAt:r.printedAt||now(), name:r.file.name, items:r.items.length, by:me.id, at:now()};
      // first real import retires the fake TEST items
      S.items.filter(i=>/^TEST /.test(i.name)&&!i.archived).forEach(i=>{ i.archived=true; });
      let added=0, updated=0, kept=0;
      for(const ki of r.items){
        const same=i=>!/^TEST /.test(i.name) && i.name.toLowerCase()===ki.name.toLowerCase() && i.unit.toLowerCase()===ki.unit.toLowerCase();
        // an archived item stays archived when it shows up in a later report
        let it=S.items.find(i=>!i.archived && same(i)) || S.items.find(i=>i.archived && same(i));
        if(!it){ it={id:uid("I"), name:ki.name, unit:ki.unit, category:"Uncategorised", strength:guessStrength(ki.name)}; S.items.push(it); added++; } else if(it.archived) kept++; else updated++;
        it.klinify={reportId:repId, total:ki.total, plusTotal:ki.plusTotal, minusRows:ki.minusRows, batches:ki.batches, printedAt:S.report.printedAt};
      }
      log(`Imported Klinify report ${r.file.name} (${r.items.length} items: ${added} new, ${updated} updated${kept?`, ${kept} kept archived`:""})`); await save();
      view={name:"home"}; toast(`Saved ${r.items.length} items`); return render();
    }
    case "open": return go({name:"session", id:d.id});
    case "opentask": return go({name:"task", id:d.id, t:d.t});
    // tasks
    case "assign": if(!can("assign")) return; return go({name:"assign", id:view.id, ab:"place", pick:{}});
    case "asg": view.asg=el.value; return render();
    case "ab": view.ab=el.value; view.pick={}; return render();
    case "apick": view.pick=view.pick||{}; view.pick[d.k]=el.checked; return render();
    case "aq": view.aq=el.value; await render(); { const i=$("#aq"); i.focus(); i.setSelectionRange(i.value.length,i.value.length); } return;
    case "alabel": view.alabel=el.value; return;
    case "maketask": {
      if(!can("assign")) return; const s=sess(); const groups=assignGroups(s, view.ab||"place");
      const keys=Object.keys(view.pick||{}).filter(k=>view.pick[k]&&groups[k]); const slots=keys.flatMap(k=>groups[k].slots);
      if(!view.asg || !slots.length) return toast("Choose a person and at least one place.");
      if(view.asg===s.preparer) return toast("The person who entered the Klinify figures cannot count.");
      const label=(($("#alabel")||{}).value||"").trim() || keys.map(k=>groups[k].label).slice(0,3).join(", ")+(keys.length>3?` and ${keys.length-3} more`:"");
      const t={id:uid("T"), label, assignee:view.asg, slots, by:me.id, at:now(), submittedAt:null, verifiedBy:null, verifiedAt:null};
      (s.tasks ||= []).push(t); log(`Assigned task "${label}" (${slots.length} places) to ${userName(t.assignee)}`); await save();
      toast(`Task given to ${userName(t.assignee)}`); return go({name:"session", id:s.id});
    }
    case "submittask": { const s=sess(); const t=liveTasks(s).find(x=>x.id===view.t);
      if(!t || t.assignee!==me.id) return; if(t.slots.some(x=>!s.lines[x.i].counts[x.loc])) return toast("Count every place first.");
      t.submittedAt=now(); t.returnNote=null; log(`Submitted task "${t.label}" for checking`); await save(); toast("Submitted for checking"); return render(); }
    case "verifytask": { const s=sess(); const t=liveTasks(s).find(x=>x.id===view.t);
      if(!can("verify") || !t || !t.submittedAt) return; if(t.assignee===me.id) return toast("Someone else must check your own task.");
      t.verifiedBy=me.id; t.verifiedAt=now(); log(`Verified task "${t.label}" counted by ${userName(t.assignee)}`); await save(); toast("Task verified"); return render(); }
    case "returntask": { const s=sess(); const t=liveTasks(s).find(x=>x.id===view.t); if(!can("verify") || !t) return;
      return askText("Send back for recount", "What should be rechecked?", "", async v=>{ t.submittedAt=null; t.returnNote=v; t.returnedBy=me.id; t.returnedAt=now();
        log(`Sent back task "${t.label}" to ${userName(t.assignee)}: ${v}`); await save(); toast("Sent back"); render(); }); }
    case "canceltask": { const s=sess(); const t=liveTasks(s).find(x=>x.id===view.t); if(!can("assign") || !t) return;
      return confirmBox("Cancel this task?", `The ${t.slots.length} place(s) go back to the unassigned list.`, "Cancel task", async ()=>{ t.cancelled=true; t.cancelledBy=me.id; t.cancelledAt=now();
        log(`Cancelled task "${t.label}"`); await save(); go({name:"session", id:s.id}); }, true); }
    // final valuation
    case "finalise": { const s=sess(); if(!can("export") || S.finals.some(f=>f.sessionId===s.id)) return;
      if(s.lines.some(l=>!lineClosed(l))) return toast("Some differences still need a decision.");
      const per=new Date(s.createdAt).toLocaleDateString("en-GB",{timeZone:TZ,month:"long",year:"numeric"});
      const arch=s.lines.filter(l=>{ const it=item(l.itemId); return !it||it.archived; }).length;
      modal(`<h2>Finalise for Accounts</h2><p class="muted">This saves the verified quantities and the unit costs as they are now. Later changes to items or costs will not change this record.${arch?` ${arch} archived item(s) are left out.`:""}</p>
        <label for="fper">Reporting period<input id="fper" value="${esc(per)}"></label><div class="row"><button style="flex:1" data-act="mclose">Cancel</button><button style="flex:1" class="primary" data-act="mok">Finalise</button></div>`);
      window._mok = async ()=>{ const period=$("#fper").value.trim(); if(!period) return; closeModal();
        const fin=buildFinal(s, period); S.finals.unshift(fin);
        log(`Finalised stock valuation for ${s.type} count (${fin.rows.length} items, RM ${money(fin.totalSen)}${fin.missing?`, ${fin.missing} cost missing`:""})`); await save(); toast("Finalised"); render(); };
      return; }
    case "exportxlsx": { if(!can("export")) return; const fin=S.finals.find(f=>f.id===d.f); if(fin) return exportXlsx(fin); return; }
    case "srcphoto": { const p=await pickPhoto(); if(p){ const s=sess(); s.sourcePhoto=p; await save(); render(); } return; }
    case "viewsrc": { const s=sess(); const u=await photoUrl(s.sourcePhoto); modal(`<h2>Klinify screenshot</h2><p class="muted">Checked ${fmt(s.sourceAt)}${s.scope?` · ${esc(s.scope)}`:""}</p><img src="${u}" alt="Klinify screenshot"><button data-act="mclose">Close</button>`); return; }
    case "handover": {
      const s=sess(); const blanks=s.lines.filter(l=>String(l.expected).trim()==="").length;
      const bad=s.lines.find(l=>String(l.expected).trim()!=="" && toMilli(l.expected)===null);
      if(bad){ toast(`Check the Klinify figure for ${item(bad.itemId).name}`); return; }
      const doIt = async ()=>{ s.status="counting"; s.handedAt=now(); log(`Entered Klinify figures for ${s.type} count and handed over${blanks?` (${blanks} PROVISIONAL)`:""}`); await save(); me=null; go("home"); toast("Handed over. Pass the phone to the counter."); };
      if(blanks) return confirmBox("Some figures are blank", `${blanks} item(s) have no Klinify figure. They will be counted but marked PROVISIONAL, not treated as zero.`, "Hand over anyway", doIt);
      return confirmBox("Hand over for counting?","You will be signed out so the counter can sign in. You cannot change the Klinify figures after this.","Hand over", doIt);
    }
    // counting
    case "countitem": return go({name:"countitem", id:view.id, i:+d.i, task:d.t||null, drafts:{}});
    case "locphoto": { const p=await pickPhoto(); if(p){ view.drafts=view.drafts||{}; view.drafts[d.loc]={...(view.drafts[d.loc]||{}), qty:$("#q"+d.loc).value, photo:p}; render(); } return; }
    case "savecount": {
      const s=sess(); if(s.preparer===me.id){ toast("The preparer cannot count."); return; }
      if(!canCountSlot(s, view.i, d.loc)){ toast("This place is counted by someone else."); return; }
      const l=s.lines[view.i]; const dr=(view.drafts||{})[d.loc]||{}; const qty=$("#q"+d.loc).value.trim(); const photo=dr.photo||(l.counts[d.loc]||{}).photo;
      if(qty===""){ toast("Enter a number. Type 0 if the place is empty."); return; }
      const m=toMilli(qty); if(m===null||m<0){ toast("Use a number that is 0 or more."); return; }
      if(!photo){ toast("Take a photo of the stock at this place."); return; }
      const prev=l.counts[d.loc]; l.counts[d.loc]={qty:fromMilli(m), photo, by:me.id, at:now(), prev: prev?[...(prev.prev||[]),{qty:prev.qty,at:prev.at}]:[]};
      if(!s.counter) s.counter=me.id; const loc=S.locations.find(x=>x.id===d.loc);
      log(`${prev?"Changed":"Counted"} ${item(l.itemId).name} at ${loc.label}: ${fromMilli(m)}`); await save();
      delete view.drafts[d.loc]; toast("Saved"); return render();
    }
    case "askfinish": return confirmBox("Finish and compare?","After this, counts are locked and the Klinify figures are shown.","Finish", async ()=>{
      const s=sess(); if(s.preparer===me.id) return toast("The preparer cannot finish the count.");
      if(!can("finish")) return toast("A stock manager or Dr Nazren finishes the count.");
      if(liveTasks(s).some(t=>!t.verifiedAt)) return toast("Every task must be verified first.");
      if(progress(s).done!==progress(s).total) return toast("Every place must be counted first.");
      s.finishedBy=me.id;
      s.lines.forEach(l=>{ const tot=l.locIds.reduce((a,id)=>a+toMilli(l.counts[id].qty),0); l.total=fromMilli(tot);
        l.result = String(l.expected).trim()==="" ? "NO_SOURCE" : fromMilli(tot - toMilli(l.expected)); });
      s.status="complete"; s.completedAt=now(); log(`Finished ${s.type} count: ${s.lines.filter(l=>l.result==="0").length}/${s.lines.length} matched`); await save(); go({name:"session", id:s.id});
    });
    // variance
    case "line": return go({name:"line", id:d.sid||view.id, i:+d.i});
    case "rc": view.rc=view.rc||{}; view.rc[d.f]=el.value; return;
    case "rcphoto": { const p=await pickPhoto(); if(p){ view.rc=view.rc||{}; view.rc.qty=$("#rcq").value; view.rc.note=$("#rcn").value; view.rc.reason=$("#rcr").value; view.rc.photo=p; render(); } return; }
    case "rcsubmit": {
      const s=sess(); const l=s.lines[view.i]; const r=view.rc||{}; r.qty=$("#rcq").value.trim(); r.reason=$("#rcr").value; r.note=$("#rcn").value.trim();
      const m=toMilli(r.qty); if(m===null||m<0) return toast("Enter the recount total (0 or more).");
      if(!r.reason) return toast("Choose a likely reason."); if(r.reason==="Other"&&!r.note) return toast("Add details for 'Other'.");
      if(!r.photo) return toast("Take a supporting photo.");
      if(l.recount) l.recountHistory=[...(l.recountHistory||[]), {...l.recount, review:l.review}];
      l.recount={qty:fromMilli(m), reason:r.reason, note:r.note, photo:r.photo, by:me.id, at:now()}; l.review={status:"pending"};
      log(`Recounted ${item(l.itemId).name}: ${fromMilli(m)} (${r.reason})`); await save(); view.rc={}; toast("Sent to Dr Nazren"); return render();
    }
    case "rvnote": view.rvnote=el.value; return;
    case "approve": {
      const s=sess(); const l=s.lines[view.i]; const note=($("#rvn")||{}).value||"";
      if(d.d==="return" && !note.trim()) return toast("Add a note saying what to recheck.");
      return askAdminPin(async ()=>{
        l.review = d.d==="return" ? {status:"returned", by:me.id, at:now(), note} : {status:"approved", decision:d.d, by:me.id, at:now(), note};
        log(`${d.d==="return"?"Sent back":"Approved ("+(d.d==="adjust"?"adjust Klinify":"no adjustment")+")"} ${item(l.itemId).name}`); await save(); view.rvnote=""; toast("Decision saved"); render();
      });
    }
    case "kref": view.kref=el.value; return;
    case "kauth": view.kauth=el.checked; return;
    case "saveref": {
      const s=sess(); const l=s.lines[view.i]; const ref=$("#kref").value.trim();
      if(!ref) return toast("Enter the Klinify reference."); if(!$("#kauth").checked) return toast("Only someone who already has Klinify adjustment rights can record this.");
      l.review.klinifyRef=ref; l.review.refBy=me.id; l.review.refAt=now(); log(`Recorded Klinify reference ${ref} for ${item(l.itemId).name}`); await save(); toast("Reference saved"); return render();
    }
    // items
    case "isearch": view.q=el.value; await render(); const i=$("#isearch"); i.focus(); i.setSelectionRange(i.value.length,i.value.length); return;
    case "niname": view.niname=el.value; return;
    case "niunit": view.niunit=el.value; return;
    case "additem": { if(!can("items")) return; const n=$("#niname").value.trim(), u=$("#niunit").value.trim(); if(!n||!u) return toast("Enter the item name and unit.");
      if(S.items.some(x=>!x.archived&&x.name.toLowerCase()===n.toLowerCase())) return toast("That item already exists.");
      const id=uid("I"); S.items.push({id,name:n,unit:u,category:"Uncategorised",strength:guessStrength(n)}); log(`Added item ${n} (${u})`); await save(); view.niname=view.niunit=""; toast("Item added. Now add its places."); return render(); }
    case "addloc": return askText("Add a place", "Place name", "", async v=>{ const it=item(d.id); if(activeLocs(it.id).some(l=>l.label.toLowerCase()===v.toLowerCase())) return toast("That place already exists.");
      S.locations.push({id:uid("L"),itemId:it.id,label:v,active:true}); log(`Added place "${v}" for ${it.name}`); await save(); render(); });
    case "renloc": { const l=S.locations.find(x=>x.id===d.id); return askText("Rename place","Place name",l.label, async v=>{ log(`Renamed place "${l.label}" to "${v}" for ${item(l.itemId).name}`); l.label=v; await save(); render(); }); }
    case "archloc": { const l=S.locations.find(x=>x.id===d.id); return confirmBox("Remove this place?", `${l.label} will no longer be counted for ${item(l.itemId).name}. Past counts keep it.`, "Remove", async ()=>{ l.active=false; log(`Removed place "${l.label}" for ${item(l.itemId).name}`); await save(); render(); }, true); }
    case "ipick": view.ipick=!view.ipick; view.isel={}; return render();
    case "isel": view.isel=view.isel||{}; view.isel[d.id]=el.checked; return render();
    case "iselshown": { view.isel=view.isel||{}; const q=(view.q||"").toLowerCase(); S.items.filter(i=>!i.archived&&i.name.toLowerCase().includes(q)).forEach(i=>view.isel[i.id]=true); return render(); }
    case "iselnone": view.isel={}; return render();
    case "showarch": view.showArch=!view.showArch; return render();
    case "archone": return archiveItems([d.id]);
    case "bulkarch": return archiveItems(Object.keys(view.isel||{}).filter(k=>view.isel[k]));
    case "bulkcat": { if(!can("items")) return; const ids=Object.keys(view.isel||{}).filter(k=>view.isel[k]); if(!ids.length) return;
      return askCategory(`Set category for ${ids.length} item(s)`, "", async v=>{ ids.forEach(id=>{ const it=item(id); if(it) it.category=v; }); log(`Set category "${v}" for ${ids.length} item(s)`); await save(); view.isel={}; toast("Category saved"); render(); }); }
    case "editdetails": return editDetails(d.id);
    case "costfile": {
      if(!can("items")) return; const f=el.files&&el.files[0]; if(!f) return;
      view.busy="Reading the Excel file…"; await render();
      try{ const r=await readCostWorkbook(f); view={name:"costimport", cost:r}; }
      catch(e){ view.busy=""; toast(e.message); }
      view.busy=""; return render(); }
    case "costsave": {
      if(!can("items") || !view.cost) return; const r=view.cost; const src=`Klinify Inventory Status (${r.file})`;
      for(const c of r.changes){ const it=item(c.id); if(!it) continue; it.unitCost=c.to; it.costSource=src; it.costAt=now(); it.costBy=me.id; }
      log(`Imported unit costs from ${r.file}: ${r.changes.length} updated, ${r.zero.length} left as cost missing, ${r.notFound.length} not in the app`); await save();
      toast(`${r.changes.length} unit cost(s) saved`); return go("items"); }
    case "restoreitem": { if(!can("items")) return; const it=item(d.id);
      return confirmBox("Restore this item?", `${it.name} goes back on the active list and can be counted again.`, "Restore", async ()=>{ it.archived=false; it.restoredInfo={by:me.id, at:now(), was:it.status}; delete it.status;
        log(`Restored item ${it.name}`); await save(); toast("Restored"); render(); }); }
    case "delitem": return deleteItem(d.id);
    // staff
    case "nuname": view.nuname=el.value; return;
    case "adduser": { if(!can("users")) return; const n=$("#nuname").value.trim().replace(/\s+/g," ");
      if(!n) return toast("Enter the person's name."); if(S.users.some(u=>u.name.toLowerCase()===n.toLowerCase())) return toast("Someone with that name already exists.");
      S.users.push({id:uid("U"), name:n, role:"staff", salt:null, hash:null, active:true, createdBy:me.id, createdAt:now()});
      log(`Added staff member ${n}`); await save(); view.nuname=""; toast(`${n} added`); return render(); }
    case "toggleuser": { const u=S.users.find(x=>x.id===d.id); if(!u || !mayManage(u)) return toast("You cannot change this person.");
      u.active = u.active===false; log(`${u.active?"Turned on":"Turned off"} ${u.name}`); await save(); return render(); }
    case "resetpin": { const u=S.users.find(x=>x.id===d.id); if(!u || !mayManage(u)) return toast("You cannot change this person.");
      const doIt=async ()=>{ u.hash=u.salt=null; log(`Reset PIN for ${u.name}`); await save(); toast(`${u.name} will choose a new PIN`); render(); };
      return me.role==="admin" ? askAdminPin(doIt) : confirmBox(`Reset ${u.name}'s PIN?`, `${u.name} will choose a new PIN at next sign-in. Ask them to do it straight away.`, "Reset PIN", doIt); }
    case "setrole": { const u=S.users.find(x=>x.id===d.id); if(me.role!=="admin" || !u || u.role==="admin") return toast("Only Dr Nazren can change stock managers.");
      return askAdminPin(async ()=>{ u.role = u.role==="manager" ? "staff" : "manager"; log(`${u.role==="manager"?"Made":"Removed"} ${u.name} ${u.role==="manager"?"a stock manager":"as stock manager"}`); await save(); toast("Saved"); render(); }); }
    // backup
    case "bp": return;
    case "backup": return doBackup();
    case "rp": return;
    case "restore": return doRestore();
  }
}

// managers may change staff only; the admin may change anyone except the admin
const mayManage = u => u.role!=="admin" && (me.role==="admin" || (can("users") && u.role==="staff"));
function categoryList(){ return [...new Set(S.items.map(i=>i.category).filter(Boolean))].sort(); }
function askCategory(title, value, onOk){
  modal(`<h2>${esc(title)}</h2><label for="mcat">Category<input id="mcat" list="catlist" value="${esc(value||"")}" placeholder="e.g. Tablets, Syrups, Vaccines, Consumables"></label><datalist id="catlist">${categoryList().map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
  <div class="row"><button style="flex:1" data-act="mclose">Cancel</button><button style="flex:1" class="primary" data-act="mok">Save</button></div>`);
  window._mok = ()=>{ const v=$("#mcat").value.trim(); if(!v) return; closeModal(); onOk(v); };
}
function editDetails(id){
  if(!can("items")) return; const it=item(id);
  modal(`<h2>${esc(it.name)}</h2><label for="dcat">Category<input id="dcat" list="catlist" value="${esc(it.category||"")}"></label><datalist id="catlist">${categoryList().map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
  <label for="dstr">Strength / specification<input id="dstr" value="${esc(it.strength||"")}"></label>
  <label for="dcost">Unit cost (RM per ${esc(it.unit)})<input id="dcost" inputmode="decimal" value="${esc(it.unitCost||"")}" placeholder="Leave blank if not known"></label>
  ${it.costSource?`<p class="muted">Last set from ${esc(it.costSource)} · ${fmt(it.costAt)}</p>`:""}
  <div id="merr"></div><div class="row"><button style="flex:1" data-act="mclose">Cancel</button><button style="flex:1" class="primary" data-act="mok">Save</button></div>`);
  window._mok = async ()=>{
    const cat=$("#dcat").value.trim()||"Uncategorised", str=$("#dstr").value.trim(), cost=$("#dcost").value.trim().replace(/^RM\s*/i,"");
    if(cost && costTT(cost)===null) return $("#merr").innerHTML=`<div class="notice bad">Unit cost must be a number, for example 0.35 or 12.50.</div>`;
    const ch=[]; if(cat!==it.category) ch.push(`category "${cat}"`); if(str!==(it.strength||"")) ch.push(`strength "${str}"`); if(cost!==(it.unitCost||"")) ch.push(`unit cost ${cost?"RM "+cost:"cleared"}`);
    if(cost!==(it.unitCost||"")){ it.costSource="typed in the app"; it.costAt=now(); it.costBy=me.id; }
    it.category=cat; it.strength=str; it.unitCost=cost; closeModal();
    if(ch.length){ log(`Changed ${it.name}: ${ch.join(", ")}`); await save(); toast("Saved"); } render(); };
}
function archiveItems(ids){
  if(!can("items") || !ids.length) return;
  const names=ids.map(id=>item(id).name);
  modal(`<h2>Archive ${ids.length===1?esc(names[0]):ids.length+" items"}?</h2>
  <p class="muted">Archived items leave the active list, new counts and new tasks. Past counts and finalised reports keep them. You can restore them later.</p>
  <label for="astat">Mark as<select id="astat">${ARCHIVE_STATUSES.map(x=>`<option>${esc(x)}</option>`).join("")}</select></label>
  <label for="areason">Reason<textarea id="areason" rows="2" placeholder="e.g. No longer supplied"></textarea></label>
  <div id="merr"></div><div class="row"><button style="flex:1" data-act="mclose">Cancel</button><button style="flex:1" class="danger" data-act="mok">Archive</button></div>`);
  window._mok = async ()=>{
    const status=$("#astat").value, reason=$("#areason").value.trim();
    if(!reason) return $("#merr").innerHTML=`<div class="notice bad">Give a reason.</div>`;
    closeModal();
    for(const id of ids){ const it=item(id); it.archived=true; it.status=status; it.archivedInfo={by:me.id, at:now(), reason};
      // counts still being prepared drop the item; counts already handed over keep their record
      S.sessions.filter(x=>x.status==="preparing").forEach(x=>{ x.lines=x.lines.filter(l=>l.itemId!==id); });
      log(`Archived ${it.name} as ${status}: ${reason}`); }
    await save(); view.isel={}; toast(`${ids.length} item(s) archived`); render(); };
}
function deleteItem(id){
  if(!can("items")) return; const it=item(id);
  if(S.sessions.some(x=>x.lines.some(l=>l.itemId===id))) return toast("This item is in past counts, so it can only be archived.");
  modal(`<h2>Delete ${esc(it.name)} permanently?</h2><p class="muted">Use this only for a wrong or duplicate import. It cannot be undone.</p>
  <label for="dreason">Reason<input id="dreason" placeholder="e.g. Duplicate of another item"></label>
  <label for="dconf">Type DELETE to confirm<input id="dconf" autocomplete="off"></label>
  <div id="merr"></div><div class="row"><button style="flex:1" data-act="mclose">Cancel</button><button style="flex:1" class="danger" data-act="mok">Delete</button></div>`);
  window._mok = async ()=>{
    const reason=$("#dreason").value.trim();
    if(!reason) return $("#merr").innerHTML=`<div class="notice bad">Give a reason.</div>`;
    if($("#dconf").value.trim()!=="DELETE") return $("#merr").innerHTML=`<div class="notice bad">Type DELETE in capitals to confirm.</div>`;
    closeModal(); S.items=S.items.filter(i=>i.id!==id); S.locations=S.locations.filter(l=>l.itemId!==id);
    S.removed.push({name:it.name, unit:it.unit, by:me.id, at:now(), reason}); log(`Deleted ${it.name} permanently: ${reason}`); await save(); toast("Deleted"); render(); };
}

async function doBackup(){
  const p1=$("#bp1").value, p2=$("#bp2").value;
  if(p1.length<10) return toast("Use at least 10 characters."); if(p1!==p2) return toast("The two passphrases do not match.");
  toast("Creating recovery copy…");
  const keys = await tx("photos","readonly",s=>s.getAllKeys());
  const photos = {};
  for(const k of keys){ const b=await photoGet(k); photos[k]={t:b.type||"image/jpeg", d:b64(await b.arrayBuffer())}; }
  const plain = enc.encode(JSON.stringify({app:"nc-stock-check", test:TEST_BUILD, made:now(), state:S, photos}));
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM",iv}, await aesKey(p1,salt), plain);
  const blob = new Blob([JSON.stringify({format:"ncstock-1", test:TEST_BUILD, salt:b64(salt), iv:b64(iv), data:b64(ct)})], {type:"application/octet-stream"});
  const name = `NC-Stock-${TEST_BUILD?"TEST-":""}${new Date().toLocaleDateString("en-CA",{timeZone:TZ})}.ncstock`;
  const file = new File([blob], name, {type:"application/octet-stream"});
  let shared=false;
  try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); shared=true; } }catch(e){ if(e.name==="AbortError") return toast("Not saved. Try again and choose Google Drive."); }
  if(!shared){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
  S.lastBackup=now(); log(`Created recovery copy ${name}`); await save();
  render(); toast(shared?"Choose Google Drive › Stock NC to save":"Recovery copy downloaded. Move it to Stock NC Drive.");
}
async function doRestore(){
  const pass=$("#rp").value; if(!pass) return toast("Enter the passphrase first.");
  if(S.sessions.length || S.users.some(u=>u.hash)) return toast("This app already has records. Restore only works on an empty app.");
  const inp=document.createElement("input"); inp.type="file"; inp.className="photo-in";
  inp.onchange = async ()=>{
    const f=inp.files[0]; inp.remove(); if(!f) return;
    try{
      const box=JSON.parse(await f.text()); if(box.format!=="ncstock-1") throw new Error("Not an NC Stock recovery file.");
      if(!!box.test!==TEST_BUILD) throw new Error("Test and clinic recovery files cannot be mixed.");
      const plain = await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(box.iv)}, await aesKey(pass,unb64(box.salt)), unb64(box.data));
      const obj=JSON.parse(new TextDecoder().decode(plain));
      for(const [k,v] of Object.entries(obj.photos)){ const o=typeof v==="string"?{t:"image/jpeg",d:v}:v; await photoPut(k, new Blob([unb64(o.d)],{type:o.t})); }
      S=migrate(obj.state); S.log.unshift({at:now(),by:"-",text:`Restored from recovery copy made ${fmt(obj.made)}`}); await save(); toast("Restored. Sign in with your usual PIN."); go("home");
    }catch(e){ toast(e.name==="OperationError"?"Wrong passphrase or damaged file. Nothing was changed.":e.message); }
  };
  document.body.appendChild(inp); inp.click();
}

document.addEventListener("click", e=>{ const el=e.target.closest("[data-act]"); if(!el || el.tagName==="INPUT" || el.tagName==="SELECT" || el.tagName==="TEXTAREA") return; e.preventDefault(); act(el.dataset.act, el).catch(err=>toast(err.message)); });
document.addEventListener("click", e=>{ if(e.target.id==="pdfin"||e.target.id==="costin") window._picking=Date.now(); }, true);
document.addEventListener("change", e=>{ const el=e.target; if(el.id==="pdfin"){ act("importpdf", el).catch(err=>toast(err.message)); return; }
  if(el.id==="costin"){ act("costfile", el).catch(err=>toast(err.message)); return; } if(el.dataset && el.dataset.act && (el.type==="checkbox"||el.tagName==="SELECT")) act(el.dataset.act, el).catch(err=>toast(err.message)); });
document.addEventListener("input", async e=>{
  const el=e.target; if(!el.dataset||!el.dataset.act) return; const a=el.dataset.act;
  if(view.name==="session" && me){ const s=S.sessions.find(x=>x.id===view.id); if(s && s.status==="preparing" && s.preparer===me.id){
    if(a==="exp") s.lines[+el.dataset.i].expected=el.value.trim();
    else if(a==="unit") s.lines[+el.dataset.i].unit=el.value.trim();
    else if(a==="scope") s.scope=el.value;
    else if(a==="srcat"){ s.sourceAtLocal=el.value; s.sourceAt = el.value? new Date(el.value+":00+08:00").toISOString() : null; await save(); return render(); }
    await save(); return; } }
  if(["rc","rvnote","kref","niname","niunit","isearch","bp","rp","nq","iq","aq","alabel","nuname"].includes(a) && el.type!=="checkbox" && el.tagName!=="SELECT") act(a, el);
});

(async function start(){
  try{
    db = await openDb(); S = await kvGet("state");
    if(!S){ S=blankState(); await save(); }
    else if(!S.v || S.v<2 || !S.finals){ S=migrate(S); await save(); }
  }catch(e){ $("#app").innerHTML = `<div class="notice bad">This browser blocked storage, so records cannot be saved here. Open the app in Chrome (not a private tab).</div>`; return; }
  render();
})();
</script>
